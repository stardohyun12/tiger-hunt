<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>호랑이 추격 — 프로토타입</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; height:100dvh; background:#2B2320; overflow:hidden;
    font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
    overscroll-behavior:none; touch-action:none;
    -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
    -webkit-user-select:none; user-select:none; }
  #wrap { position:fixed; inset:0; display:grid; place-items:center; }
  canvas { display:block; touch-action:none; cursor:crosshair; image-rendering:pixelated; }
  #portrait-guide { position:fixed; inset:0; z-index:10; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:0.8rem;
    padding:2rem; background:#2B2320; color:#E8DCC0; text-align:center; }
  #portrait-guide strong { color:#B03A2E; font-size:1.5rem; }
  #portrait-guide span { font-size:1rem; }
  @media (orientation: portrait) {
    #portrait-guide { display:flex; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="portrait-guide" role="status">
  <strong>가로로 돌려주세요 📱↻</strong>
  <span>《호랑이 추격》은 가로 화면 게임입니다</span>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
