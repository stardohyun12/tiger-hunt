<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>호랑이 추격 — D8 스프라이트 판정판</title>
<style>
  :root { --paper:#E8DCC0; --ink:#2B2320; --ochre:#C8862A; --vermilion:#B03A2E; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:700 14px/1.5 system-ui,sans-serif; letter-spacing:.08em; }
  header { position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    padding:14px 20px; background:var(--paper); border-bottom:4px solid var(--ink); }
  h1 { margin:0 auto 0 0; font-size:20px; font-weight:900; }
  button { border:3px solid var(--ink); padding:8px 12px; background:var(--paper); color:var(--ink);
    font:900 13px system-ui; letter-spacing:.08em; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  main { padding:20px; }
  .note { margin:0 0 18px; max-width:860px; }
  .animation { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:24px; padding:16px;
    border:4px solid var(--vermilion); }
  .animation h2 { flex:0 0 100%; margin:0; color:var(--vermilion); font-size:16px; }
  .anim-box { display:grid; gap:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
  .card { padding:12px; border:3px solid var(--ink); background:color-mix(in srgb,var(--paper) 88%,transparent); }
  .card h2 { margin:0 0 10px; font-size:15px; }
  .views { display:grid; grid-template-columns:72px 1fr; align-items:end; gap:14px; }
  .view { display:grid; gap:5px; align-content:end; }
  .stage { display:grid; place-items:center; min-height:118px; padding:8px; background:var(--stage,var(--paper)); border:2px solid var(--ink); }
  canvas { display:block; image-rendering:pixelated; }
  small { font-weight:800; }
  body.dark { --stage:var(--ink); }
</style>
</head>

<header>
  <h1>《호랑이 추격》 D8 스프라이트 판정판</h1>
  <button id="silhouette" type="button" aria-pressed="false">흑실루엣: 끔</button>
  <button id="background" type="button" aria-pressed="false">배경: 한지</button>
</header>
<main>
  <p class="note">1×는 원본 아트 픽셀, 4×는 실제 칸을 확대한 모습입니다. X는 주색, o는 호랑이의 먹 줄무늬입니다.</p>
  <section class="animation">
    <h2>거리 기반 2프레임 교대 판정</h2>
    <div class="anim-box"><strong>사슴+기수</strong><div class="stage"><canvas id="deer-anim"></canvas></div></div>
    <div class="anim-box"><strong>호랑이</strong><div class="stage"><canvas id="tiger-anim"></canvas></div></div>
  </section>
  <section class="grid" id="grid"></section>
</main>

let silhouette = false;
let dark = false;

function palette(name) {
  const tiger = name.startsWith('tiger');
  return { main: silhouette ? colors.ink : tiger ? colors.ochre : colors.ink, alt: colors.ink };
}

function paint(canvas, name, scale) {
  const sprite = sprites[name];
  const width = sprite[0].length;
  canvas.width = width * scale;
  canvas.height = sprite.length * scale;
  const ctx = canvas.getContext('2d');
  const tone = palette(name);
  for (let y = 0; y < sprite.length; y++) {
    let x = 0;
    while (x < width) {
      const cell = sprite[y][x];
      if (cell === '.') { x++; continue; }
      let end = x + 1;
      while (end < width && sprite[y][end] === cell) end++;
      ctx.fillStyle = silhouette ? colors.ink : cell === 'o' ? tone.alt : tone.main;
      ctx.fillRect(x * scale, y * scale, (end - x) * scale, scale);
      x = end;
    }
  }
}

function addCard(name) {
  const card = document.createElement('article');
  card.className = 'card';
  card.innerHTML = `<h2>${name} · ${sprites[name][0].length}×${sprites[name].length}</h2><div class="views"></div>`;
  const views = card.querySelector('.views');
  for (const scale of [1, 4]) {
    const view = document.createElement('div');
    view.className = 'view';
    view.innerHTML = `<small>${scale}×</small><div class="stage"><canvas></canvas></div>`;
    paint(view.querySelector('canvas'), name, scale);
    views.append(view);
  }
  document.querySelector('#grid').append(card);
}

function repaint() {
  document.querySelector('#grid').replaceChildren();
  Object.keys(sprites).forEach(addCard);
}

const deerAnim = document.querySelector('#deer-anim');
const tigerAnim = document.querySelector('#tiger-anim');
let frame = 0;
function animate() {
  paint(deerAnim, frame ? 'deerRunB' : 'deerRunA', 4);
  paint(tigerAnim, frame ? 'tigerRunB' : 'tigerRunA', 4);
  frame = 1 - frame;
}
setInterval(animate, 180);
animate();
repaint();

document.querySelector('#silhouette').addEventListener('click', (event) => {
  silhouette = !silhouette;
  event.currentTarget.ariaPressed = String(silhouette);
  event.currentTarget.textContent = `흑실루엣: ${silhouette ? '켬' : '끔'}`;
  repaint(); animate();
});
document.querySelector('#background').addEventListener('click', (event) => {
  dark = !dark;
  document.body.classList.toggle('dark', dark);
  event.currentTarget.ariaPressed = String(dark);
  event.currentTarget.textContent = `배경: ${dark ? '먹' : '한지'}`;
});
