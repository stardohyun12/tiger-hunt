# dist/play.html 을 GitHub Pages 로 배포한다.
# dist/ 는 .gitignore 대상이므로 CI 가 매번 build.mjs 로 새로 굽는다.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 의존성 0 프로젝트 — install 단계가 없다
      - name: 결정론 테스트
        run: node --test tests/determinism.test.mjs

      - name: 단일 파일 빌드
        run: node build.mjs

      - name: 배포 디렉터리 구성
        run: |
          mkdir -p _site
          cp dist/play.html _site/index.html
          cp dist/play.html _site/play.html
          # 아트 판정 페이지 — 도현이 폰에서 1×/4×/흑실루엣으로 스프라이트를 본다
          if [ -d docs/art ]; then cp docs/art/*.html _site/ 2>/dev/null || true; fi
          if [ -d public ]; then cp -r public/. _site/ 2>/dev/null || true; fi
          ls -la _site

      # 폰 브라우저가 캐시를 물고 있으면 "고쳤는데 그대로"가 된다.
      # 화면 구석에 커밋 해시를 박아 지금 보는 빌드를 구분할 수 있게 한다.
      - name: 빌드 스탬프 주입
        env:
          SHA: ${{ github.sha }}
        run: |
          node -e '
            const fs = require("fs");
            const sha = (process.env.SHA || "").slice(0, 7);
            const stamp = `<div style="position:fixed;left:4px;bottom:3px;z-index:99;`
              + `font:9px ui-monospace,monospace;color:#E8DCC0;opacity:.38;`
              + `pointer-events:none;user-select:none">${sha}</div>`;
            for (const f of ["_site/index.html", "_site/play.html"]) {
              const html = fs.readFileSync(f, "utf8");
              if (!html.includes("</body>")) { console.error("no </body> in " + f); process.exit(1); }
              fs.writeFileSync(f, html.replace("</body>", stamp + "</body>"));
            }
            console.log("빌드 스탬프:", sha);
          '

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
